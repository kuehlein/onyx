include: package:flutter_lints/flutter.yaml

analyzer:
  # Enables riverpod_lint's rules (missing autoDispose, provider-dependency and
  # ref-misuse checks, etc.) in the IDE and via `dart run custom_lint`. The
  # codebase is currently clean against them; this keeps it that way.
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - tools/** # the onyx_lints plugin is its own package (checked via custom_lint)
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    unawaited_futures: true
