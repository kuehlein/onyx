pre-commit:
  parallel: true
  commands:
    dart-format:
      glob: "**/*.dart"
      run: dart format --set-exit-if-changed {staged_files}
    dart-analyze:
      run: flutter analyze --no-fatal-infos

# custom_lint (riverpod_lint) is a full-project pass (~30s), too slow for every
# commit — it runs on push instead. The analyzer plugin gives live IDE feedback
# in between.
pre-push:
  commands:
    custom-lint:
      run: flutter pub run custom_lint

commit-msg:
  commands:
    validate-format:
      # Enforces conventional commits: type(scope): description
      # Types: feat, fix, docs, refactor, test, chore, perf, style, revert
      run: |
        msg=$(cat {1})
        pattern="^(feat|fix|docs|refactor|test|chore|perf|style|revert)(\([^)]+\))?: .{1,72}$"
        if ! echo "$msg" | grep -qE "$pattern"; then
          echo ""
          echo "  Invalid commit message."
          echo "  Expected: type(scope): description  (scope optional)"
          echo "  Types: feat | fix | docs | refactor | test | chore | perf | style | revert"
          echo "  Example: feat(quiz): add FSRS grade buttons"
          echo ""
          exit 1
        fi
